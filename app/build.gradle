plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.co.dsroll.calculator'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.co.dsroll.calculator'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 사내 배포용: 별도 키가 없으면 디버그 키로 서명합니다.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
